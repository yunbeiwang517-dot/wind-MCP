name: Build Windows Portable

on:
  push:
    paths:
      - '.github/workflows/build-windows-portable.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name "Wind-MCP" mcp_app.py

      - name: Add portable readme
        shell: pwsh
        run: |
          @"
          Wind-MCP Windows 便携版

          使用方法：
          1. 将整个 ZIP 解压到本地文件夹。
          2. 双击 Wind-MCP.exe。
          3. 不需要安装 Python 或 Anaconda。

          注意：
          - 不要只把 EXE 单独复制出去，Wind-MCP 文件夹中的依赖文件需要一起保留。
          - 如果 Windows 首次运行提示未知发布者，可选择“更多信息”后继续运行。
          "@ | Set-Content -Encoding UTF8 "dist\Wind-MCP\使用说明.txt"

      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Wind-MCP\*" -DestinationPath "Wind-MCP-Windows便携版.zip" -Force
          $hash=(Get-FileHash "Wind-MCP-Windows便携版.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  Wind-MCP-Windows便携版.zip" | Set-Content -Encoding ASCII "Wind-MCP-Windows便携版.sha256.txt"

      - name: Smoke test executable
        shell: pwsh
        run: |
          if (!(Test-Path "dist\Wind-MCP\Wind-MCP.exe")) { throw "Wind-MCP.exe not found" }
          $size=(Get-Item "dist\Wind-MCP\Wind-MCP.exe").Length
          if ($size -lt 100000) { throw "Wind-MCP.exe looks too small" }
          Write-Host "Wind-MCP.exe size: $size bytes"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-portable --yes --cleanup-tag 2>$null
          gh release create windows-portable "Wind-MCP-Windows便携版.zip" "Wind-MCP-Windows便携版.sha256.txt" --title "Wind-MCP Windows 便携版" --notes "Windows 免 Python 便携版。下载 ZIP、解压后双击 Wind-MCP.exe 即可运行。"

      - name: Remove build workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/build-windows-portable.yml"
          git commit -m "chore: remove temporary Windows build workflow"
          git push
