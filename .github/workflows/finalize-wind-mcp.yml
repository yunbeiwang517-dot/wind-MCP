name: Finalize wind-MCP source upload

on:
  push:
    paths:
      - '.github/workflows/finalize-wind-mcp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and publish source
        shell: bash
        run: |
          set -euo pipefail

          cat .stage_upload/part_* | base64 -d > /tmp/wind_mcp_clean.tar.xz

          echo "9e935a79edf89252c7130a113239551bf28f868779b84d0335c2be77f197552d  /tmp/wind_mcp_clean.tar.xz" | sha256sum -c -

          tar -xJf /tmp/wind_mcp_clean.tar.xz -C .

          rm -rf .stage_upload
          rm -f .github/workflows/finalize-wind-mcp.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish wind-MCP source"
          git push
