name: Cleanup wind-MCP release

on:
  push:
    paths:
      - '.github/workflows/cleanup-wind-mcp.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove portable release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-portable --yes --cleanup-tag || true
